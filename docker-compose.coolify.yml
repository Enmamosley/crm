# ─────────────────────────────────────────────────────────
# CRM Mosley — despliegue en Coolify (Build Pack: Docker Compose)
#
# - El dominio se asigna en Coolify al servicio `nginx` (puerto 80);
#   el proxy de Coolify gestiona HTTPS. Sin container_name ni labels
#   de Traefik: Coolify los genera.
# - Variables: se definen en la pestaña "Environment Variables" de Coolify.
#   APP_KEY debe ser la de producción, o las sesiones y tokens actuales
#   dejan de valer.
# - Ver docs/COOLIFY.md para importar la base de datos y los archivos.
# ─────────────────────────────────────────────────────────

x-app-env: &app-env
  APP_NAME: "${APP_NAME:-CRM Mosley}"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "${APP_URL:-https://app.mosley.digital}"
  APP_KEY: "${APP_KEY:?APP_KEY es obligatoria}"
  APP_LOCALE: "${APP_LOCALE:-es}"
  APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-es}"
  BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:-crm}"
  DB_USERNAME: "${DB_USERNAME:-crm_user}"
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatoria}"
  SESSION_DRIVER: database
  SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
  SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
  SESSION_DOMAIN: "${SESSION_DOMAIN:-}"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  LOG_CHANNEL: stderr
  LOG_LEVEL: "${LOG_LEVEL:-error}"
  MAIL_MAILER: "${MAIL_MAILER:-log}"
  MAIL_SCHEME: "${MAIL_SCHEME:-}"
  MAIL_HOST: "${MAIL_HOST:-}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-no-reply@app.mosley.digital}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-CRM Mosley}"
  DMCHAMP_API_KEY: "${DMCHAMP_API_KEY:-}"
  DMCHAMP_FUNCTION_TOKEN: "${DMCHAMP_FUNCTION_TOKEN:-}"
  DMCHAMP_WEBHOOK_SECRET: "${DMCHAMP_WEBHOOK_SECRET:-}"
  MP_ACCESS_TOKEN: "${MP_ACCESS_TOKEN:-}"
  MP_WEBHOOK_SECRET: "${MP_WEBHOOK_SECRET:-}"
  FACTURAPI_KEY: "${FACTURAPI_KEY:-}"
  TWENTYI_API_KEY: "${TWENTYI_API_KEY:-}"

services:

  # ── PHP-FPM 8.3 (ejecuta migraciones y caches al arrancar) ─
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment: *app-env
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Nginx (asignar aquí el dominio en Coolify, puerto 80) ─
  nginx:
    build:
      context: .
      target: web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - storage_app:/var/www/html/storage/app:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── MySQL 8.0 ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-crm}"
      MYSQL_USER: "${DB_USERNAME:-crm_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatoria}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD es obligatoria}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD 2>/dev/null | grep -q alive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Cola (QUEUE_CONNECTION=database) ──────────────────────
  queue:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment: *app-env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy

  # ── Scheduler ─────────────────────────────────────────────
  # En el servidor actual NO hay cron para este CRM, así que tareas como
  # recordatorios de pago, facturas recurrentes y cobranza (dunning) no se
  # están ejecutando. Queda apagado hasta que SCHEDULER_ENABLED=true.
  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-false}"
    command: ["/bin/sh", "-c", "if [ \"$$SCHEDULER_ENABLED\" = \"true\" ]; then exec php artisan schedule:work; else echo 'Scheduler desactivado (SCHEDULER_ENABLED!=true)'; exec sleep infinity; fi"]
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
  storage_app:
  storage_logs:
